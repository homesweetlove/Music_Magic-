name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-magic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  carousel-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test carousel and comparison on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: false
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon; test_result=$?; adb pull /data/local/tmp/music-magic-ui ui-evidence; capture_result=$?; if [ "$test_result" -ne 0 ]; then exit "$test_result"; else exit "$capture_result"; fi
      - name: Upload UI evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-ui-api-${{ matrix.api }}
          path: |
            ui-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
